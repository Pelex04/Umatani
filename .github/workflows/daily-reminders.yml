name: Daily reminders & admin digest

# Note: scheduled workflows only fire from the copy of this file on the
# default branch (main). Use "Run workflow" (workflow_dispatch, below)
# to test manually before/without waiting for the schedule.
#
# This calls the backend instead of running Brevo API calls directly
# from this runner: GitHub Actions runner IPs rotate on every run, and
# Brevo's IP-authorization security feature blocks unrecognized IPs.
# Render's IP is already authorized (that's how normal transactional
# emails already work), so the actual send happens there instead.

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily digest & reminders
        run: |
          curl -sf -X POST \
            --retry 3 --retry-delay 5 --max-time 90 \
            "${{ secrets.BACKEND_URL }}/api/v1/internal/cron/daily-digest-and-reminders" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
